{% extends 'base.html' %}

{% block title %}Admin Login - Student Dropout Early Warning System{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0">
            <div class="card-header text-center bg-dark text-white py-3">
                <h4 class="mb-0 fw-bold">
                    <i class="fa-solid fa-user-lock me-2 text-warning"></i>Admin Portal
                </h4>
                <small class="text-white-50">Student Dropout Early Warning System</small>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter admin username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Log In
                    </button>
                </form>
            </div>
            <div class="card-footer text-center bg-light py-2">
                <small class="text-muted">Default Credentials: <strong>admin</strong> / <strong>admin123</strong></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
